name: Validate

# Checks every pull request and every branch push except main (main is checked by the deploy workflow).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate workbook
        run: npm run validate
      - name: Check dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # A test build: every tool with a component is shown as published so the browser tests can use it.
      # This build is never deployed; deploy.yml builds from the workbook as it is.
      - name: Build static site (preview of all tools)
        run: npm run build:preview
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: Browser tests (Chrome, Chrome mobile, Firefox, Safari engine)
        run: npm run test:e2e
        env:
          CI: "true"
          CROSS_BROWSER: "1"
