name: Deploy to GitHub Pages

# Runs when content or code lands on main (including workbook commits made by the admin page).
# Browser tests run in validate.yml (without a base path); they cannot serve a build that uses one.
# The deploy job only runs if the build job succeeds, so a failed build never replaces the live site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate workbook
        run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - name: Build static site
        run: npm run build
        env:
          # Repository variables (Settings > Secrets and variables > Actions > Variables):
          # SITE_URL    e.g. https://example.com or https://<user>.github.io
          # BASE_PATH   "/<repo>" for a project site on github.io; leave unset for a custom domain
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          # The admin page edits this repository and branch (public information).
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
          NEXT_PUBLIC_GITHUB_BRANCH: ${{ github.ref_name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
